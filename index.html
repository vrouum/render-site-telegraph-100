<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Article Render</title>
    <style>
        body { font-family: Georgia, 'Times New Roman', Times, serif; color: #333333; line-height: 1.7; margin: 0; padding: 40px 20px; background-color: #ffffff; }
        .container { max-width: 700px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 42px; font-weight: bold; text-align: center; margin-bottom: 20px; line-height: 1.2; }
        .meta { text-align: center; font-size: 14px; color: #999999; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #eeeeee; }
        p { font-size: 18px; margin-bottom: 20px; text-align: justify; }
        a { color: #000000; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Titre de votre article</h1>
        <div class="meta">Écrit par Votre Nom • 24 Mai 2024</div>
        <p>Bonjour, ceci est un paragraphe d'exemple hébergé sur Render. Le style est minimaliste, semblable à Telegraph.</p>
    </div>
</body>
</html>
